name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # the layout tests measure real text widths; Linux runners ship different fonts than Windows/macOS/iOS,
    # which shifts some layouts by a pixel, so the suite runs on Windows like local development
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chrome webkit
      - name: End-to-end tests (Playwright · Chrome + WebKit)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
